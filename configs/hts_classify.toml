# hts-classify smoke test: 3 customs rulings from the validation split x 1 rollout, the tool-less
# `null` harness, local subprocess runtime, nothing uploaded. First run downloads the rows and the HS
# nomenclature from Hugging Face (under a megabyte) into the local cache.
#
#   uv run --env-file .env eval @ configs/hts_classify.toml --no-rich
#   ... --env.taskset.split test -n 200                          # the 200 held-out rulings
#   ... --env.taskset.source hscodecomp --env.taskset.split test  # the 632 expert-labeled listings
num_tasks = 3
num_rollouts = 1
push = false

[env.taskset]
id = "hts-classify"
source = "cross"
split = "validation"

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
