# ghs-hazards smoke test: 3 substances from the validation split x 1 rollout, the tool-less `null`
# harness, local subprocess runtime, nothing uploaded. First run downloads the 1.1 MB safety-data
# table from Hugging Face into the local cache.
#
#   uv run --env-file .env eval @ configs/ghs_hazards.toml --no-rich
#   ... --env.taskset.split test -n 589                          # the held-out substances
#   ... --env.taskset.cas true                                   # recognition (CAS shown) instead of classification
#   ... --env.taskset.negatives false                            # only substances that carry hazard statements
num_tasks = 3
num_rollouts = 1
push = false

[env.taskset]
id = "ghs-hazards"
split = "validation"

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
