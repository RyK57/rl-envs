# commercial-underwriting smoke test: 3 expert-verified cases x 1 rollout, the tool-less `null`
# harness, local subprocess runtime, nothing uploaded. First run downloads both Snorkel releases
# (about 22 MB).
#
#   uv run --env-file .env eval @ configs/commercial_underwriting.toml --no-rich
#   ... --env.taskset.split test                                    # every held-out expert case
#   ... --env.taskset.source synthetic --env.taskset.split test -n 200  # rule-generated cases
num_tasks = 3
num_rollouts = 1
push = false

[env.taskset]
id = "commercial-underwriting"
source = "snorkel"
split = "validation"

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
