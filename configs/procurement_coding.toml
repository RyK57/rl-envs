# procurement-coding smoke test: 3 contract actions from the validation split x 1 rollout, the
# tool-less `null` harness, local subprocess runtime, nothing uploaded. First run downloads one
# 77 MB shard of the USAspending archive.
#
#   uv run --env-file .env eval @ configs/procurement_coding.toml --no-rich
#   ... --env.taskset.split test -n 500                          # held-out actions, NAICS
#   ... --env.taskset.field psc --env.taskset.split test -n 500  # held-out actions, PSC
num_tasks = 3
num_rollouts = 1
push = false

[env.taskset]
id = "procurement-coding"
field = "naics"
split = "validation"

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
