# medical-coding smoke test: 3 case histories from the validation split x 1 rollout, the tool-less
# `null` harness, local subprocess runtime, nothing uploaded. First run downloads the case reports,
# the CodiEsp corpus and the ICD-10-CM table (a few megabytes).
#
#   uv run --env-file .env eval @ configs/medical_coding.toml --no-rich
#   ... --env.taskset.split test                                  # held-out case histories
#   ... --env.taskset.source codiesp --env.taskset.split test     # the 250 CodiEsp test cases
num_tasks = 3
num_rollouts = 1
push = false

[env.taskset]
id = "medical-coding"
source = "cases"
split = "validation"

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
