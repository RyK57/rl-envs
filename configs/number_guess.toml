# number-guess smoke test: 3 tasks x 1 rollout, the tool-less `null` harness, local subprocess
# runtime, nothing uploaded. The env ends each episode itself; max_turns is only a safety net.
#
#   uv run --env-file .env eval @ configs/number_guess.toml --no-rich
num_tasks = 3
num_rollouts = 1
push = false

[env.taskset]
id = "number-guess"

[env.agent]
max_turns = 12

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
