# prime-rl GRPO run over count-letters: the smallest end-to-end loop, one trainer GPU plus one
# inference GPU. Mirrors prime-rl's `configs/basic/reverse-text/rl.toml`; the only part that is
# ours is the `[[orchestrator.train.source]]` block, which is exactly the `[env]` block of an eval
# config. Not run yet. On a two-GPU machine, from a prime-rl checkout with its venv active:
#
#   prime env install rlab27/count-letters       # the published package, into prime-rl's venv
#   uv run rl @ count_letters_rl.toml
#
# No wandb block on purpose: prime-rl logs to the terminal, and wandb would ask for a key.

max_steps = 20
seq_len = 2048

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3-0.6B"

[orchestrator]
batch_size = 128
group_size = 16

[orchestrator.train.sampling]
max_completion_tokens = 512

[[orchestrator.train.source]]
name = "count-letters"
env.taskset.id = "count-letters"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.optim]
lr = 3e-6

[ckpt]

[inference]

[orchestrator.renderer]
name = "prime-qwen3"
