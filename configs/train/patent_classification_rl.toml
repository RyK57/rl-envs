# prime-rl run over patent-classification: train on the applications of the training split,
# evaluate every 25 steps on 500 held-out applications. Layer an overlay from configs/train/algo/
# to change the algorithm:
#
#   uv run rl @ patent_classification_rl.toml
#   uv run rl @ patent_classification_rl.toml @ algo/gspo.toml

max_steps = 100
seq_len = 2048

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3-1.7B"

[monitors.file]

[orchestrator]
batch_size = 128
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "patent-classification"
env.taskset.id = "patent-classification"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "applications-test"
num_examples = 500
env.taskset.id = "patent-classification"
env.taskset.split = "test"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.optim]
lr = 3e-6

[ckpt]
interval = 25
keep_last = 2

[inference]

[orchestrator.renderer]
name = "prime-qwen3"
