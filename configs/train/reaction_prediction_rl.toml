# prime-rl GRPO run over reaction-prediction: train on USPTO-50K's 40,008 training reactions, evaluate
# before and after on its validation and test splits. The environment block is the `[env]` block of
# configs/reaction_prediction.toml. The product is compared by RDKit as a uv script inside the rollout
# runtime; under the subprocess runtime that is the orchestrator host, which installs it once. On a
# two-GPU machine, from a prime-rl checkout with its venv active:
#
#   prime env install rlab27/reaction-prediction --no-upgrade   # after `prime env push` of the package
#   uv run rl @ reaction_prediction_rl.toml                     # grpo
#   uv run rl @ reaction_prediction_rl.toml @ algo/gspo.toml    # the same run under another algorithm
#
# Metrics land in outputs/<run>/monitors/file/metrics.jsonl; scripts/compare_runs.py reads them.

max_steps = 100
seq_len = 2048

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3-1.7B"

[monitors.file]

[orchestrator]
batch_size = 128
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "reaction-prediction"
env.taskset.id = "reaction-prediction"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

# Evaluate every 25 steps on the benchmark's own held-out splits.
[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "reactions-validation"
env.taskset.id = "reaction-prediction"
env.taskset.split = "validation"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
num_examples = 500

[[orchestrator.eval.source]]
name = "reactions-test"
env.taskset.id = "reaction-prediction"
env.taskset.split = "test"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
num_examples = 500

[trainer.optim]
lr = 3e-6

[ckpt]
interval = 25
keep_last = 2

[inference]

[orchestrator.renderer]
name = "prime-qwen3"
