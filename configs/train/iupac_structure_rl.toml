# prime-rl GRPO run over iupac-structure: train on the training compounds (name to SMILES), evaluate
# before and after on the held-out compounds, both as SMILES and as the easier formula target. The
# environment block is the `[env]` block of configs/iupac_structure.toml. The SMILES reward runs RDKit
# as a uv script inside the rollout runtime; under the subprocess runtime that is the orchestrator
# host, which installs it once. On a two-GPU machine, from a prime-rl checkout with its venv active:
#
#   prime env install rlab27/iupac-structure --no-upgrade   # after `prime env push` of the package
#   uv run rl @ iupac_structure_rl.toml                     # grpo
#   uv run rl @ iupac_structure_rl.toml @ algo/gspo.toml    # the same run under another algorithm
#
# Metrics land in outputs/<run>/monitors/file/metrics.jsonl; scripts/compare_runs.py reads them.

max_steps = 100
seq_len = 2048

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3-1.7B"

[monitors.file]

[orchestrator]
batch_size = 128
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "iupac-structure"
env.taskset.id = "iupac-structure"
env.taskset.target = "smiles"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

# Evaluate every 25 steps on the held-out compounds, as structures and as formulas.
[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "smiles-test"
env.taskset.id = "iupac-structure"
env.taskset.target = "smiles"
env.taskset.split = "test"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
num_examples = 500

[[orchestrator.eval.source]]
name = "formula-test"
env.taskset.id = "iupac-structure"
env.taskset.target = "formula"
env.taskset.split = "test"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
num_examples = 500

[trainer.optim]
lr = 3e-6

[ckpt]
interval = 25
keep_last = 2

[inference]

[orchestrator.renderer]
name = "prime-qwen3"
