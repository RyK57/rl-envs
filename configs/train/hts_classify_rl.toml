# prime-rl GRPO run over hts-classify: train on the 18,254 customs rulings, evaluate before and after
# on the held-out rulings and the expert-labeled listings. Mirrors prime-rl's reverse-text example;
# the environment block is the `[env]` block of configs/hts_classify.toml. On a two-GPU machine, from
# a prime-rl checkout with its venv active:
#
#   prime env install rlab27/hts-classify --no-upgrade     # after `prime env push` of the package
#   uv run rl @ hts_classify_rl.toml                       # grpo
#   uv run rl @ hts_classify_rl.toml @ algo/gspo.toml      # the same run under another algorithm
#
# Metrics land in outputs/<run>/monitors/file/metrics.jsonl; scripts/compare_runs.py reads them.

max_steps = 100
seq_len = 2048

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3-1.7B"

[monitors.file]

[orchestrator]
batch_size = 128
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "hts-classify"
env.taskset.id = "hts-classify"
env.taskset.source = "cross"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

# Evaluate every 25 steps on both held-out sets; the same rows the baselines used.
[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "rulings-test"
env.taskset.id = "hts-classify"
env.taskset.source = "cross"
env.taskset.split = "test"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[[orchestrator.eval.source]]
name = "listings"
env.taskset.id = "hts-classify"
env.taskset.source = "hscodecomp"
env.taskset.split = "test"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.optim]
lr = 3e-6

[ckpt]
interval = 25
keep_last = 2

[inference]

[orchestrator.renderer]
name = "prime-qwen3"
