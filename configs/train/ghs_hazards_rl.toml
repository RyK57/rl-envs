# prime-rl GRPO run over ghs-hazards: train on the 4,679 training substances, evaluate before and after
# on the held-out split. The environment block is the `[env]` block of configs/ghs_hazards.toml. On a
# two-GPU machine, from a prime-rl checkout with its venv active:
#
#   prime env install rlab27/ghs-hazards --no-upgrade       # after `prime env push` of the package
#   uv run rl @ ghs_hazards_rl.toml                         # grpo
#   uv run rl @ ghs_hazards_rl.toml @ algo/gspo.toml        # the same run under another algorithm
#
# Metrics land in outputs/<run>/monitors/file/metrics.jsonl; scripts/compare_runs.py reads them.

max_steps = 100
seq_len = 2048

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3-1.7B"

[monitors.file]

[orchestrator]
batch_size = 128
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "ghs-hazards"
env.taskset.id = "ghs-hazards"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

# Evaluate every 25 steps on the held-out substances, with and without the `none` cases.
[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "substances-test"
env.taskset.id = "ghs-hazards"
env.taskset.split = "test"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[[orchestrator.eval.source]]
name = "hazardous-test"
env.taskset.id = "ghs-hazards"
env.taskset.split = "test"
env.taskset.negatives = false
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.optim]
lr = 3e-6

[ckpt]
interval = 25
keep_last = 2

[inference]

[orchestrator.renderer]
name = "prime-qwen3"
