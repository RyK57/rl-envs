# prime-rl GRPO run over mol-properties: train on the formula of the training compounds, evaluate
# before and after on the held-out compounds for the formula and for two harder properties. The
# environment block is the `[env]` block of configs/mol_properties.toml. The gold is computed by RDKit
# as a uv script inside the rollout runtime; under the subprocess runtime that is the orchestrator
# host, which installs it once. On a two-GPU machine, from a prime-rl checkout with its venv active:
#
#   prime env install rlab27/mol-properties --no-upgrade     # after `prime env push` of the package
#   uv run rl @ mol_properties_rl.toml                       # grpo
#   uv run rl @ mol_properties_rl.toml @ algo/gspo.toml      # the same run under another algorithm
#
# Metrics land in outputs/<run>/monitors/file/metrics.jsonl; scripts/compare_runs.py reads them.

max_steps = 100
seq_len = 2048

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3-1.7B"

[monitors.file]

[orchestrator]
batch_size = 128
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "mol-properties"
env.taskset.id = "mol-properties"
env.taskset.property = "formula"
env.taskset.split = "train"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

# Evaluate every 25 steps on the held-out compounds: the trained property and two it may transfer to.
[orchestrator.eval]
interval = 25

[[orchestrator.eval.source]]
name = "formula-test"
env.taskset.id = "mol-properties"
env.taskset.property = "formula"
env.taskset.split = "test"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
num_examples = 500

[[orchestrator.eval.source]]
name = "weight-test"
env.taskset.id = "mol-properties"
env.taskset.property = "molecular_weight"
env.taskset.split = "test"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
num_examples = 500

[[orchestrator.eval.source]]
name = "stereocenters-test"
env.taskset.id = "mol-properties"
env.taskset.property = "stereocenters"
env.taskset.split = "test"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
num_examples = 500

[trainer.optim]
lr = 3e-6

[ckpt]
interval = 25
keep_last = 2

[inference]

[orchestrator.renderer]
name = "prime-qwen3"
