# summarize smoke test: 3 tasks x 1 rollout, tool-less `null` harness, local subprocess runtime,
# nothing uploaded. The judge is the same cheap model by default; swap it here or on the CLI.
#
#   uv run --env-file .env eval @ configs/summarize.toml --no-rich
num_tasks = 3
num_rollouts = 1
push = false

[env.taskset]
id = "summarize"

[env.taskset.task.judge]
model = "deepseek/deepseek-v4-flash"

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
