# sanctions-screening smoke test: 3 pairs from the published sample x 1 rollout, the tool-less `null`
# harness, local subprocess runtime, nothing uploaded. First run downloads the 4 MB sample; the train
# split downloads the 400 MB corpus once.
#
#   uv run --env-file .env eval @ configs/sanctions_screening.toml --no-rich
#   ... --env.taskset.split test -n 500                 # the 500 held-out pairs
num_tasks = 3
num_rollouts = 1
push = false

[env.taskset]
id = "sanctions-screening"
split = "validation"

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
