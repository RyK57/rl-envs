[project]
name = "pyfix"
version = "0.1.0"
description = "Fix one planted bug in a small Python function; hidden tests run inside the sandbox."
requires-python = ">=3.11"
tags = ["code", "sandbox", "agentic", "v1"]
dependencies = [
    "verifiers>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyfix"]
