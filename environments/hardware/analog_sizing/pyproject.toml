[project]
name = "analog-sizing"
version = "0.1.0"
license = "MIT"
description = "Size a two-stage CMOS op-amp to a specification; ngspice grades the sizes in a fresh sandbox."
requires-python = ">=3.11"
tags = ["hardware", "sandbox", "agentic", "v1"]
dependencies = [
    "verifiers>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analog_sizing"]
