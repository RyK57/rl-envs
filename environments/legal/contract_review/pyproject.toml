[project]
name = "contract-review"
version = "0.1.0"
description = "Classify or extract the clauses a lawyer reviews in a commercial contract, scored against CUAD's expert annotations."
requires-python = ">=3.11"
tags = ["single-turn", "legal", "classification", "extraction", "v1"]
dependencies = [
    "verifiers>=0.3.1",
    "datasets>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contract_review"]
