[project]
name = "guess-golf"
version = "0.1.0"
description = "Several games of one number-guess task per episode, the fewest guesses wins (multi-attempt env, relative reward)."
requires-python = ">=3.11"
tags = ["multi-turn", "multi-attempt", "v1"]
dependencies = [
    "verifiers>=0.3.1",
    "number-guess",
]

[tool.uv.sources]
number-guess = { path = "../number_guess", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guess_golf"]
