[project]
name = "count-letters"
version = "0.1.0"
description = "Count how often a letter appears in a short passage (single-turn, procedural, exact-match)."
requires-python = ">=3.11"
tags = ["single-turn", "procedural", "v1"]
dependencies = [
    "verifiers>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["count_letters"]
