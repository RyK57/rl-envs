[project]
name = "injury-coding"
version = "0.1.0"
description = "Code workplace injury narratives with OIICS nature, part of body, event and source codes, scored against OSHA's severe injury reports."
requires-python = ">=3.11"
tags = ["single-turn", "safety", "insurance", "classification", "v1"]
dependencies = [
    "verifiers>=0.3.1",
    "huggingface_hub>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["injury_coding"]
