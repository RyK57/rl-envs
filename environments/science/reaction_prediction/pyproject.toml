[project]
name = "reaction-prediction"
version = "0.1.0"
description = "The product of an organic reaction from its reactants, scored by RDKit against USPTO-50K."
requires-python = ">=3.11"
tags = ["single-turn", "science", "chemistry", "v1"]
dependencies = [
    "verifiers>=0.3.1",
    "huggingface_hub>=0.24",
    "pyarrow>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reaction_prediction"]
