[project]
name = "dna-tasks"
version = "0.1.0"
description = "Translate, reverse-complement, find the longest ORF of, or measure the GC content of a random DNA sequence; an infinite procedural taskset with the standard genetic code as the gold."
requires-python = ">=3.11"
tags = ["single-turn", "science", "biology", "procedural", "v1"]
dependencies = [
    "verifiers>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dna_tasks"]
