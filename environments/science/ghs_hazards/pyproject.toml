[project]
name = "ghs-hazards"
version = "0.1.0"
description = "The GHS hazard statements (H-codes) of a substance from its structure, scored by set F1 with hazard-class partial credit against Sigma-Aldrich safety data."
requires-python = ">=3.11"
tags = ["single-turn", "science", "chemistry", "classification", "v1"]
dependencies = [
    "verifiers>=0.3.1",
    "huggingface_hub>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghs_hazards"]
