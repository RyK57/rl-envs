[project]
name = "iupac-structure"
version = "0.1.0"
description = "The SMILES or the molecular formula of a compound from its IUPAC name, scored by RDKit against PubChem."
requires-python = ">=3.11"
tags = ["single-turn", "science", "chemistry", "v1"]
dependencies = [
    "verifiers>=0.3.1",
    "huggingface_hub>=0.24",
    "pyarrow>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iupac_structure"]
