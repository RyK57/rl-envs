[project]
name = "commercial-underwriting"
version = "0.1.0"
description = "Policy limits, deductibles and NAICS classification for small-business insurance applications, scored against expert-verified underwriting cases."
requires-python = ">=3.11"
tags = ["single-turn", "insurance", "underwriting", "v1"]
dependencies = [
    "verifiers>=0.3.1",
    "datasets>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commercial_underwriting"]
