[project]
name = "medical-coding"
version = "0.1.0"
description = "Assign ICD-10-CM diagnosis codes to clinical histories, scored against coded case reports and the CodiEsp expert corpus."
requires-python = ">=3.11"
tags = ["single-turn", "healthcare", "classification", "v1"]
dependencies = [
    "verifiers>=0.3.1",
    "datasets>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medical_coding"]
