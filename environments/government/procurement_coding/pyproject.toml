[project]
name = "procurement-coding"
version = "0.1.0"
description = "Code a federal contract action to its NAICS industry or product/service code, scored against USAspending records."
requires-python = ">=3.11"
tags = ["single-turn", "government", "classification", "v1"]
dependencies = [
    "verifiers>=0.3.1",
    "huggingface_hub>=0.24",
    "pyarrow>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["procurement_coding"]
