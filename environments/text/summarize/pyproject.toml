[project]
name = "summarize"
version = "0.1.0"
description = "Two-sentence summaries of short passages, graded for faithfulness and coverage by an LLM judge."
requires-python = ">=3.11"
tags = ["text", "single-turn", "judge", "v1"]
dependencies = [
    "verifiers>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["summarize"]
