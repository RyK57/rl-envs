[project]
name = "rl-envs"
version = "0.1.0"
description = "A learning catalog of verifiers v1 RL environments, built one concept at a time."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.3.1",
    "count-letters",
    "number-guess",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.12.1",
]

[tool.uv]
# The repo root is a catalog, not an installable package; environments are the packages.
package = false

# Every environment is an editable path dependency, so `uv sync` installs the whole catalog
# and `uv run eval <taskset-id>` resolves any of them.
[tool.uv.sources]
count-letters = { path = "environments/toy/count_letters", editable = true }
number-guess = { path = "environments/toy/number_guess", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]
