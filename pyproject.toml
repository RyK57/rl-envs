[project]
name = "rl-envs"
version = "0.1.0"
description = "A learning catalog of verifiers v1 RL environments, built one concept at a time."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.3.1",
    "count-letters",
    "number-guess",
    "gsm8k",
    "pyfix",
    "summarize",
    "guess-golf",
    "hts-classify",
    "sanctions-screening",
    "contract-review",
    "commercial-underwriting",
    "medical-coding",
    "patent-classification",
    "procurement-coding",
    "injury-coding",
    "rl-losses",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.12.1",
]

[tool.uv]
# The repo root is a catalog, not an installable package; environments are the packages.
package = false

# Every environment is an editable path dependency, so `uv sync` installs the whole catalog
# and `uv run eval <taskset-id>` resolves any of them.
[tool.uv.sources]
count-letters = { path = "environments/toy/count_letters", editable = true }
number-guess = { path = "environments/toy/number_guess", editable = true }
gsm8k = { path = "environments/math/gsm8k", editable = true }
pyfix = { path = "environments/code/pyfix", editable = true }
summarize = { path = "environments/text/summarize", editable = true }
guess-golf = { path = "environments/toy/guess_golf", editable = true }
hts-classify = { path = "environments/trade/hts_classify", editable = true }
sanctions-screening = { path = "environments/banking/sanctions_screening", editable = true }
contract-review = { path = "environments/legal/contract_review", editable = true }
commercial-underwriting = { path = "environments/insurance/commercial_underwriting", editable = true }
medical-coding = { path = "environments/healthcare/medical_coding", editable = true }
patent-classification = { path = "environments/ip/patent_classification", editable = true }
procurement-coding = { path = "environments/government/procurement_coding", editable = true }
injury-coding = { path = "environments/safety/injury_coding", editable = true }
rl-losses = { path = "rl_losses", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]
